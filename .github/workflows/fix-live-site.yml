name: Fix and validate live site
on:
  push:
    paths:
      - '.github/repair-ui.py'
      - '.github/stable-runtime-hotfix.py'
      - '.github/dedupe-games.py'
      - '.github/library-guard.py'
      - '.github/library_guard.py'
      - '.github/game_validator.py'
      - '.github/site-finalizer.py'
      - '.github/interaction-polish.py'
      - '.github/search-rail-visibility.py'
      - '.github/workflows/fix-live-site.yml'
      - 'legacy-index.html'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ubg43-maintenance
  cancel-in-progress: false
jobs:
  repair:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[live-fix]') && !contains(github.event.head_commit.message, '[game-builder]') && !contains(github.event.head_commit.message, '[undertale-builder]') && !contains(github.event.head_commit.message, '[automation-hardening]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Repair stable runtime hotfix script before execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/stable-runtime-hotfix.py')
          s=p.read_text(encoding='utf-8')
          old="s = re.sub(r'</body>', runtime + '\\n</body>', s, count=1, flags=re.I)"
          new="s = re.sub(r'</body>', lambda _m: runtime + '\\n</body>', s, count=1, flags=re.I)"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              print('Stable runtime script repair applied.')
          else:
              print('Stable runtime script already uses a safe replacement callback.')
          PY
      - name: Write stable UBG43 homepage
        run: python3 .github/repair-ui.py
      - name: Harden stable runtime and restore interaction badges
        run: python3 .github/stable-runtime-hotfix.py
      - name: Remove duplicate game cards
        run: python3 .github/dedupe-games.py
      - name: Enforce final duplicate-free library
        run: python3 .github/library-guard.py
      - name: Run final site sanity checks
        run: python3 .github/site-finalizer.py
      - name: Apply UBG43 search and badge interaction polish
        run: python3 .github/interaction-polish.py
      - name: Apply search rail visibility rules
        run: python3 .github/search-rail-visibility.py
      - name: Validate homepage structure and browser scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys,tempfile,subprocess
          idx=Path('index.html').read_text(encoding='utf-8')
          leg=Path('legacy-index.html').read_text(encoding='utf-8')
          required=['id="gameGrid"','id="searchBar"','id="categoryToggle"','id="randomGameButton"','id="reportGameButton"','window.openGame=openGame','function setSearchMode','function isTrending','ubg43-interaction-polish-runtime','ubg43-interaction-polish-style','ubg43-search-rail-visibility','Play games instantly with UBG43!','1000+ games','Trending Now','New Games','You may also like','https://forms.gle/zXYtnxwXhGvXmBrq9','legacy-index.html','zones.json','rel="canonical"','application/ld+json','.ubg43-badge.new','.ubg43-badge.trending','api.counterapi.dev','ubg43-global-trending-v1','function loadGlobalTrending','Most played across UBG43','rel="icon"','<title>Google Docs</title>']
          bad=[x for x in required if x not in idx]
          wrong=['https://forms.gle/zXYtnxwHgvXmBrq9','https://forms.gle/zXYtnxwGvXmBrq9']
          bad += ['wrong report URL: '+x for x in wrong if x in idx]
          forbidden=['Building your game library…','Building your game library...','id="loadingCard"','new MutationObserver','ubg43-site-protection-runtime','ubg43-hotfix-runtime','ubg43-direct-launch-runtime','ubg43-final-interactions-runtime']
          bad += ['forbidden runtime remains: '+x for x in forbidden if x in idx]
          if idx.count('id="gameGrid"')!=1: bad.append('gameGrid must exist exactly once')
          if idx.count('<script type="application/ld+json">')!=1: bad.append('JSON-LD count is wrong')
          if idx.count('ubg43-search-rail-visibility')<1: bad.append('search rail visibility marker missing')
          if '.ubg43-searching #trendingSection,.ubg43-searching #newSection{display:none!important}' not in idx: bad.append('search rails are not forced hidden in search mode')
          if '.ubg43-category-view #trendingSection,.ubg43-category-view #newSection{display:none!important}' not in idx: bad.append('category rails are not hidden for selected categories')
          cards=re.findall(r'<(?:div|article)\s+class="game-card"[^>]*>',leg,re.I)
          titles=re.findall(r'<h3[^>]*>(.*?)</h3>',leg,re.I|re.S)
          clean=lambda s:re.sub(r'\s+',' ',re.sub(r'<[^>]+>','',s)).strip().casefold()
          tt=[clean(x) for x in titles if clean(x)]
          if len(cards)<300: bad.append(f'legacy game cards too low: {len(cards)}')
          if len(tt)!=len(set(tt)): bad.append('duplicate legacy game titles detected')
          scripts=re.findall(r'<script([^>]*)>(.*?)</script>',idx,re.I|re.S)
          with tempfile.TemporaryDirectory() as td:
              for i,(attrs,body) in enumerate(scripts):
                  if 'application/ld+json' in attrs.lower() or not body.strip(): continue
                  f=Path(td)/f'script{i}.js';f.write_text(body,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode: bad.append('JavaScript syntax error: '+(r.stderr.strip().splitlines()[-1] if r.stderr.strip() else 'unknown'))
          if bad:
              print('LIVE SITE VALIDATION FAILED')
              print('\n'.join(bad))
              sys.exit(1)
          print(f'LIVE SITE VALIDATION PASSED: {len(cards)} unique legacy game cards; search hides homepage rails, clears back to homepage rails, NEW/TRENDING badges, categories, random, report, carousels, recommendations, direct launches, and JavaScript syntax are valid.')
          PY
      - name: Commit repaired site and runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html legacy-index.html .github/stable-runtime-hotfix.py .github/interaction-polish.py .github/search-rail-visibility.py
          git diff --cached --quiet && exit 0
          git commit -m 'Apply stable UBG43 homepage [live-fix]'
          git fetch origin main
          git rebase origin/main
          git push
