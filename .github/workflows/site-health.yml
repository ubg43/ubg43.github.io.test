name: Automated site health
# Static homepage library must be present before browser-side enhancements run.
on:
  push:
    paths:
      - 'index.html'
      - 'legacy-index.html'
      - '.github/site-finalizer.py'
      - '.github/site-health.py'
      - '.github/repair-ui.py'
      - '.github/stable-runtime-hotfix.py'
      - '.github/game_validator.py'
      - '.github/library-guard.py'
      - '.github/auto-categories.py'
      - '.github/extra-games.py'
      - '.github/workflows/**'
      - 'undertale-thumbnails/**'
  schedule:
    - cron: '12 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run duplicate-free library audit
        run: python3 .github/library-guard.py --check
      - name: Validate stable UBG43 homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys,tempfile,subprocess
          idx=Path('index.html').read_text(encoding='utf-8')
          leg=Path('legacy-index.html').read_text(encoding='utf-8')
          required=['id="gameGrid"','id="searchBar"','id="categoryToggle"','id="randomGameButton"','id="reportGameButton"','window.openGame=openGame','Play games instantly with UBG43!','1000+ games','Trending Now','New Games','You may also like','https://forms.gle/zXYtnxwXhGvXmBrq9','legacy-index.html','zones.json','rel="canonical"','application/ld+json','function setSearchMode','function isTrending','window.openGame=openGame','.ubg43-badge.new','.ubg43-badge.trending','api.counterapi.dev','ubg43-global-trending-v1','global-trending.json','function loadGlobalTrending','Most played across UBG43']
          bad=[x for x in required if x not in idx]
          wrong_urls=['https://forms.gle/zXYtnxwHgvXmBrq9','https://forms.gle/zXYtnxwGvXmBrq9']
          bad += ['wrong report URL: '+x for x in wrong_urls if x in idx]
          forbidden=['new MutationObserver','ubg43-site-protection-runtime','ubg43-hotfix-runtime','ubg43-direct-launch-runtime','ubg43-final-interactions-runtime','Building your game library…','Building your game library...']
          bad += ['forbidden: '+x for x in forbidden if x in idx]
          if idx.count('id="gameGrid"')!=1: bad.append('gameGrid count != 1')
          if idx.count('<script type="application/ld+json">')!=1: bad.append('JSON-LD count != 1')
          if not Path('robots.txt').exists(): bad.append('robots.txt missing')
          if not Path('sitemap.xml').exists(): bad.append('sitemap.xml missing')
          if not Path('.github/site-finalizer.py').exists(): bad.append('site-finalizer.py missing')
          cards=re.findall(r'<(?:div|article)\s+class="game-card"[^>]*>',leg,re.I)
          index_cards=re.findall(r'<div\s+class="game-card"[^>]*>',idx,re.I)
          titles=re.findall(r'<h3[^>]*>(.*?)</h3>',leg,re.I|re.S)
          clean=lambda s:re.sub(r'\s+',' ',re.sub(r'<[^>]+>','',s)).strip().casefold()
          tt=[clean(x) for x in titles if clean(x)]
          if len(cards)<300: bad.append(f'legacy game cards too low: {len(cards)}')
          if len(index_cards)<300: bad.append(f'homepage static game cards too low: {len(index_cards)}')
          if 'id="ubg43-final-runtime"' not in idx: bad.append('canonical stable runtime script missing')
          if len(tt)!=len(set(tt)): bad.append('duplicate legacy game titles detected')
          urls=[m.group(1).split('#',1)[0].rstrip('/') for m in re.finditer(r"openGame\(\s*'([^']+)'",leg,re.I)]
          if len(urls)!=len(set(urls)): bad.append('duplicate legacy game URLs detected')
          blocked=['[!]','suggest games','d4c9vfywyu','1 date danger']
          if any(any(x in t for x in blocked) for t in tt): bad.append('non-game placeholder title detected')
          auto=Path('.github/auto-categories.py').read_text(encoding='utf-8')
          extra=Path('.github/extra-games.py').read_text(encoding='utf-8')
          if 'from game_validator import validate_candidate' not in auto: bad.append('auto-categories missing strict game validator')
          if 'from game_validator import validate_candidate' not in extra: bad.append('extra-games missing strict game validator')
          if 'stable-runtime-hotfix.py' not in Path('.github/workflows/auto-categories.yml').read_text(encoding='utf-8'): bad.append('auto workflow missing stable runtime step')
          if 'stable-runtime-hotfix.py' not in Path('.github/workflows/extra-games.yml').read_text(encoding='utf-8'): bad.append('extra workflow missing stable runtime step')
          scripts=re.findall(r'<script([^>]*)>(.*?)</script>',idx,re.I|re.S)
          with tempfile.TemporaryDirectory() as td:
              for i,(attrs,body) in enumerate(scripts):
                  if 'application/ld+json' in attrs.lower() or not body.strip(): continue
                  f=Path(td)/f'script{i}.js';f.write_text(body,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode: bad.append('JavaScript syntax error: '+(r.stderr.strip().splitlines()[-1] if r.stderr.strip() else 'unknown'))
          for wf in ['auto-categories.yml','extra-games.yml','fix-live-site.yml','change-background.yml','undertale-games.yml']:
              p=Path('.github/workflows')/wf
              if not p.exists(): bad.append('workflow missing: '+wf)
          if bad:
              print('STABLE SITE HEALTH FAILED')
              print('\n'.join(bad))
              sys.exit(1)
          print(f'STABLE SITE HEALTH PASSED: {len(cards)} unique legacy game cards, stable runtime, search/categories/random/report, carousels, recommendations, NEW/TRENDING badges, automatic workflows, and valid JavaScript.')
          PY
      - name: Check runtime seed and badge safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          idx=Path('index.html').read_text(encoding='utf-8')
          bad=[]
          index_cards=re.findall(r'<div\s+class="game-card"[^>]*>',idx,re.I)
          if len(index_cards)<300: bad.append(f'homepage static card set unexpectedly small: {len(index_cards)}')
          if '.ubg43-badge.new' not in idx: bad.append('NEW badge CSS missing')
          if '.ubg43-badge.trending' not in idx: bad.append('TRENDING badge CSS missing')
          if 'function isTrending' not in idx: bad.append('trending runtime missing')
          if 'function setSearchMode' not in idx: bad.append('search runtime missing')
          if 'window.openGame=openGame' not in idx: bad.append('direct game launch runtime missing')
          if bad:
              print('\n'.join(bad));sys.exit(1)
          print('GENERATED RUNTIME CHECK PASSED')
          PY
