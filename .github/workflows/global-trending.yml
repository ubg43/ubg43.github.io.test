name: Global trending snapshot
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - '.github/update-global-trending.py'
      - 'global-trending.json'
      - 'legacy-index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ubg43-global-trending
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build global trending snapshot
        run: python3 .github/update-global-trending.py
      - name: Commit refreshed global trending data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add global-trending.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh global trending snapshot [global-trending]'
          git fetch origin main
          git rebase origin/main
          git push
