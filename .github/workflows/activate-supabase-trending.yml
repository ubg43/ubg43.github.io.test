name: Activate Supabase global trending
on:
  push:
    paths:
      - '.github/activate-supabase-trending.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ubg43-supabase-activation
  cancel-in-progress: true
jobs:
  activate:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[live-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Activate Supabase backend in canonical runtime
        run: python3 .github/activate-supabase-trending.py
      - name: Rebuild homepage from canonical runtime
        run: python3 .github/stable-runtime-hotfix.py
      - name: Validate Supabase runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          idx=Path('index.html').read_text(encoding='utf-8')
          required=['wewynhmybroxzynaxnrx.supabase.co','SUPABASE_TRENDING_URL','function loadGlobalTrending','Most played across UBG43','window.openGame=openGame','id="gameGrid"','id="searchBar"']
          missing=[x for x in required if x not in idx]
          if 'api.counterapi.dev' in idx or 'ubg43-global-trending-v1' in idx or 'global-trending.json' in idx:
              missing.append('old global trending backend remains')
          scripts=re.findall(r'<script([^>]*)>(.*?)</script>',idx,re.I|re.S)
          with tempfile.TemporaryDirectory() as td:
              for i,(attrs,body) in enumerate(scripts):
                  if 'application/ld+json' in attrs.lower() or not body.strip(): continue
                  f=Path(td)/f'script{i}.js';f.write_text(body,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode: missing.append('JavaScript syntax error')
          if missing:
              raise SystemExit('SUPABASE TRENDING VALIDATION FAILED: '+', '.join(missing))
          print('SUPABASE TRENDING VALIDATION PASSED')
          PY
      - name: Commit activated Supabase runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/stable-runtime-hotfix.py .github/activate-supabase-trending.py .github/workflows/fix-live-site.yml .github/workflows/site-health.yml .github/site-finalizer.py
          git diff --cached --quiet && exit 0
          git commit -m 'Activate Supabase global trending [live-fix]'
          git fetch origin main
          git rebase origin/main
          git push
